<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeaveEase | Sign in</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body class="login-bg"><main class="login-card"><div class="brand-mark">LE</div><p class="eyebrow">CLOUD-BASED COLLEGE PORTAL</p><h1>Leave Application System</h1><p class="muted">Sign in to apply for leave or manage requests.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}{% endwith %}
<form method="post" class="stack"><label>Your name<input name="name" placeholder="e.g. Arunkumar Prabhu" required></label><label>Student ID <span class="muted">(student login)</span><input name="student_id" placeholder="e.g. 44110932"></label><label>Sign in as<select name="role"><option value="student">Student</option><option value="faculty">Faculty / Admin</option></select></label><button class="primary full">Continue to dashboard →</button></form><p class="hint">Demo prototype: choose a role to explore the workflow.</p></main></body></html>
